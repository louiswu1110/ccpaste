name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # manual run: build and smoke-test every platform, no release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   asset: ccpaste-windows-x86_64.exe }
          # Linux builds on 22.04 (glibc 2.35): an older glibc means the binary runs on more distros
          - { os: ubuntu-22.04,     asset: ccpaste-linux-x86_64 }
          - { os: ubuntu-22.04-arm, asset: ccpaste-linux-aarch64 }
          - { os: macos-latest,     asset: ccpaste-macos-aarch64 }
          # macos-15-intel: unverified label; the last x86_64 macOS image. Drop this leg if it is missing.
          - { os: macos-15-intel,   asset: ccpaste-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0 pyinstaller==6.11.1
      - name: Build
        shell: bash
        run: |
          cp ccpaste ccpaste.py
          pyinstaller --onefile --console --name ccpaste --hidden-import PIL.Image ccpaste.py
          mkdir out
          if [ -f dist/ccpaste.exe ]; then cp dist/ccpaste.exe "out/${{ matrix.asset }}"; else cp dist/ccpaste "out/${{ matrix.asset }}"; fi
      - name: Smoke test
        shell: bash
        run: python .github/scripts/smoke.py "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match __version__
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ccpaste)" || { echo "tag $GITHUB_REF_NAME != __version__"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Package
        run: |
          mkdir dist
          cd artifacts
          zip -j ../dist/ccpaste-windows-x86_64.zip ccpaste-windows-x86_64.exe
          for f in ccpaste-linux-* ccpaste-macos-*; do cp "$f" ../dist/; done
          cp ../ccpaste ../dist/ccpaste.py
          cd ../dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ccpaste $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md --generate-notes

  # Independent of `build`/`release` on purpose: a failed binary leg (e.g. the unverified macos-15-intel label)
  # must not block the PyPI upload, and a PyPI failure must not block the GitHub release. The wheel is
  # smoke-tested here before upload; a version already on PyPI can never be re-uploaded, so a failure means
  # bump the version and tag again.
  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi            # must match the environment name on the PyPI trusted-publisher entry
    permissions:
      id-token: write            # OIDC trusted publishing; no API token anywhere
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match __version__
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ccpaste)" || { echo "tag $GITHUB_REF_NAME != __version__"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build --outdir dist-pypi
          ls -l dist-pypi
      - name: Smoke-test the built wheel in a fresh venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist-pypi/*.whl
          /tmp/wheel-venv/bin/ccpaste --version
          /tmp/wheel-venv/bin/ccpaste --selftest
          /tmp/wheel-venv/bin/python .github/scripts/smoke.py /tmp/wheel-venv/bin/ccpaste
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi
